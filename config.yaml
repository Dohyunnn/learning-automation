models:
  # v0.1 — 단일 Sonnet 모델
  # v0.2 — critic → Opus 4.7 교체 (검증 품질 강화)
  # v0.3 — profile_analyzer → Haiku 4.5 분리 (3-tier 비용 최적화)
  profile_analyzer: "claude-sonnet-4-6"
  curriculum_designer: "claude-sonnet-4-6"
  resource_curator: "claude-sonnet-4-6"
  critic: "claude-opus-4-7"    # v0.2: Sonnet → Opus (강력한 교차 검증)

pipeline:
  max_retry: 2
  timeout_seconds: 120

confluence:
  templates:
    curriculum_page_title: "[AI Generated] {topic} 학습 커리큘럼 - {depth}"
    section_headers:
      - "📋 개요"
      - "🎯 학습 목표"
      - "📚 커리큘럼"
      - "🔗 참고 자료"
      - "✅ 검증 결과"

github:
  max_repos: 20
  max_commits_per_repo: 10
